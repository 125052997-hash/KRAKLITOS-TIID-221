<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Contacto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="card shadow-sm mx-auto" style="max-width: 600px;">
            <div class="card-body">
                <h1 class="h3 mb-4">Contacto a editar</h1>
                <form action="/actualizar/{{ contacto.0 }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" class="form-control" name="txtNombre" value="{{ contacto.1 }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Apellido</label>
                        <input type="text" class="form-control" name="txtApellido" value="{{ contacto.2 }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Teléfono</label>
                        <input type="text" class="form-control" name="txtTelefono" value="{{ contacto.3 }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Correo electrónico</label>
                        <input type="email" class="form-control" name="txtEmail" value="{{ contacto.4 }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Dirección</label>
                        <input type="text" class="form-control" name="txtDireccion" value="{{ contacto.5 }}" required>
                    </div>
                    <button type="submit" class="btn btn-success">Actualizar</button>
                    <a href="{{ url_for('index') }}" class="btn btn-secondary">Regresar</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
