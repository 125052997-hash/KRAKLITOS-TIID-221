<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar Contacto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="card shadow-sm mx-auto" style="max-width: 600px;">
            <div class="card-body">
                <h1 class="h3 mb-4 text-danger">Contacto a eliminar</h1>
                <form action="/eliminar/{{ contacto.0 }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" class="form-control" name="txtNombre" value="{{ contacto.1 }}" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Apellido</label>
                        <input type="text" class="form-control" name="txtApellido" value="{{ contacto.2 }}" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Teléfono</label>
                        <input type="text" class="form-control" name="txtTelefono" value="{{ contacto.3 }}" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Correo electrónico</label>
                        <input type="email" class="form-control" name="txtEmail" value="{{ contacto.4 }}" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Dirección</label>
                        <input type="text" class="form-control" name="txtDireccion" value="{{ contacto.5 }}" readonly>
                    </div>
                    <button type="submit" class="btn btn-danger" onclick="return Eliminar()">Eliminar</button>
                    <button type="button" class="btn btn-secondary" onclick="Regresar()">Regresar</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        function Eliminar() {
            return confirm("¿Estás seguro de que deseas eliminar este contacto?");
        }

        function Regresar() {
            window.location.href = "{{ url_for('index') }}";
        }
    </script>
</body>
</html>
